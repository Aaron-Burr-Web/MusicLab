    <div class="box_with_side"><div class="learning-content-panel"><div class="learning-content-header"><h1>贝斯系列（二）：Another One Bites the Dust</h1></div><div class="learning-content-body">
        <h2 id="another-one-bass-example">歌曲中的贝斯</h2>
        <p>《Another One Bites the Dust》的贝斯线非常有辨识度：短促、重复、紧贴鼓组，同时用少量音高变化推动和声前进。学习时先抓住节奏，再逐渐加入音高和力度变化。</p>
        <div class="chord-track-lab" data-chord-track-lab="bass-example" data-chord-track-range="bass-c3-c4" aria-label="Another One Bites the Dust 贝斯示例音轨"></div>
        <button class="learning-nav-button" type="button" data-bass-example-fill>填充教学示例</button>
        <p>可以尝试从 C3、G3、A3、F3 等低音开始，先让每个音落在稳定的节拍上，再调整空拍和重复次数。这里使用的是教学用的低音动机，不是原曲录音。</p>
