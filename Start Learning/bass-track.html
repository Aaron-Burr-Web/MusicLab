    <div class="box_with_side"><div class="learning-content-panel"><div class="learning-content-header"><h1>贝斯系列（三）：和弦、贝斯与节奏</h1></div><div class="learning-content-body">
        <section id="bass-track-group"><h2>三轨音轨群</h2><p>下面的和弦、贝斯与节奏共用一个 16 steps 播放时钟。和弦提供色彩，贝斯连接低音与律动，节奏负责推动整段音乐。三个音轨可以分别编辑，但播放时会保持对齐。</p>
            <div class="chord-track-lab" data-chord-track-lab="bass-suite" data-chord-track-range="c3-c5-chromatic" aria-label="和弦与贝斯三轨编辑器"></div>
            <h3>节奏</h3>
            <div class="beat-demo-wrapper chord-rhythm-track" data-sync-clock="true" data-demo-variant="chords-sync" aria-label="三轨音轨群的节奏音轨">
                <div class="beat-demo-header"><div class="beat-demo-transport"><button class="beat-demo-play" type="button" aria-label="播放或暂停">▶</button><button class="beat-demo-stop" type="button" aria-label="停止并回到开头">■</button><div class="beat-demo-bpm"><span class="beat-demo-label">BPM</span><span class="beat-demo-value">96</span><input class="beat-demo-slider" type="range" min="40" max="240" step="1" value="96" aria-label="BPM 调节"></div></div><button class="beat-demo-clear" type="button" aria-label="清空全部节奏块">Clear</button></div>
                <div class="beat-demo-shell"><div class="beat-demo-grid"></div><div class="beat-demo-playhead" aria-hidden="true"></div></div>
            </div>
        </section>
