                    <h2 id="chords-track">Chords音轨</h2><p>和弦音轨负责提供和声支撑，通常在关键拍点上改变和弦，这是乐曲的血肉。</p>
                    <h2 id="basslines-track">Basslines音轨</h2><p>贝斯音轨连接低音与和弦，为音乐提供律动和重心，这是乐曲的灵魂所在。</p>
                    <h2 id="melodies-track">Melodies音轨</h2><p>旋律音轨在和声上方发展旋律，负责表达主要的音乐动机，通常承载作品的主题，即乐曲的外貌。</p>
