    <div class="box_with_side"><div class="learning-content-panel"><div class="learning-content-header"><h1>音符与记谱（二）：谱与音符</h1></div>
        <div class="learning-content-body">
            <section class="notation-intro" id="notation-basics">
                <p class="pitch-lesson-kicker">看见位置，听见高度</p>
                <p class="pitch-lesson-lead">一枚四分音符，记录一个音高和一拍时值。</p>
            </section>
            <div>
                <div class="pitch-octave-map" aria-label="中央 C3 到高音 C4 的可点音高示意图">
                            <div class="pitch-map-copy">
                                <b>中央 C3 到高音 C4</b>
                                <span>点击音符头试听对应音高。</span>
                            </div>
                            <div class="pitch-map-staff" aria-label="高音谱表上的 C3 到 C4">
                                <svg viewBox="0 0 900 230" role="img" aria-label="C3 到 C4 的一个八度五线谱">
                                    <g class="pitch-map-staff-lines" aria-hidden="true">
                                        <line x1="78" y1="70" x2="850" y2="70"></line>
                                        <line x1="78" y1="86" x2="850" y2="86"></line>
                                        <line x1="78" y1="102" x2="850" y2="102"></line>
                                        <line x1="78" y1="118" x2="850" y2="118"></line>
                                        <line x1="78" y1="134" x2="850" y2="134"></line>
                                        <line x1="115" y1="150" x2="151" y2="150"></line>
                                    </g>
                                    <text class="pitch-map-clef" x="30" y="143" aria-hidden="true">𝄞</text>
                                    <g class="pitch-map-noteheads" aria-hidden="true">
                                        <ellipse cx="150" cy="150" rx="11" ry="7" transform="rotate(-18 150 150)"></ellipse>
                                        <ellipse cx="250" cy="142" rx="11" ry="7" transform="rotate(-18 250 142)"></ellipse>
                                        <ellipse cx="350" cy="134" rx="11" ry="7" transform="rotate(-18 350 134)"></ellipse>
                                        <ellipse cx="450" cy="126" rx="11" ry="7" transform="rotate(-18 450 126)"></ellipse>
                                        <ellipse cx="550" cy="118" rx="11" ry="7" transform="rotate(-18 550 118)"></ellipse>
                                        <ellipse cx="650" cy="110" rx="11" ry="7" transform="rotate(-18 650 110)"></ellipse>
                                        <ellipse cx="750" cy="102" rx="11" ry="7" transform="rotate(-18 750 102)"></ellipse>
                                        <ellipse cx="850" cy="94" rx="11" ry="7" transform="rotate(-18 850 94)"></ellipse>
                                    </g>
                                </svg>
                                <div class="pitch-map-hotspots" aria-label="点击音符试听音高">
                                    <button class="pitch-map-note pitch-audition is-anchor" type="button" data-note="C3" style="--note-x:16.67%;--note-y:65.22%" aria-label="C3，中央 C"><span class="sr-only">C3，中央 C</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="D3" style="--note-x:27.78%;--note-y:61.74%" aria-label="D3"><span class="sr-only">D3</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="E3" style="--note-x:38.89%;--note-y:58.26%" aria-label="E3"><span class="sr-only">E3</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="F3" style="--note-x:50%;--note-y:54.78%" aria-label="F3"><span class="sr-only">F3</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="G3" style="--note-x:61.11%;--note-y:51.30%" aria-label="G3"><span class="sr-only">G3</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="A3" style="--note-x:72.22%;--note-y:47.83%" aria-label="A3"><span class="sr-only">A3</span></button>
                                    <button class="pitch-map-note pitch-audition" type="button" data-note="B3" style="--note-x:83.33%;--note-y:44.35%" aria-label="B3"><span class="sr-only">B3</span></button>
                                    <button class="pitch-map-note pitch-audition is-anchor" type="button" data-note="C4" style="--note-x:94.44%;--note-y:40.87%" aria-label="C4，高音 C"><span class="sr-only">C4，高音 C</span></button>
                                </div>
                            </div>
                        </div>
            </div>
            <section class="pitch-practice notation-check" id="notation-practice">
                <div class="pitch-practice-head"><div><p class="pitch-step-label">小练习</p><h3>先读，再听</h3><p>听到的四分音符是哪个？</p></div><button class="ml-btn notation-question-play" type="button">▶ 播放题目</button></div>
                <div class="pitch-answer-keys"><button type="button" data-notation-answer="C">C</button><button type="button" data-notation-answer="D">D</button><button type="button" data-notation-answer="E">E</button><button type="button" data-notation-answer="F">F</button><button type="button" data-notation-answer="G">G</button></div><p class="pitch-practice-feedback" data-notation-feedback aria-live="polite">点击播放开始。</p>
            </section>
            <section class="lesson-quiz" data-lesson-quiz></section>
