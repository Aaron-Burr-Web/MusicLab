<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Get your MusicLab started,learning the basic knowledge of music and creating your own songs!">
        <title>
            Get your MusicLab | Home
        </title>
        <link rel="stylesheet" href="css/Home.css">
        <link rel="stylesheet" href="css/ui.css">
        <script src="js/musiclab-ui.js"></script>
    </head>
    <body class="main">
        <div class="top">
			<div class="Logo">
                <a href="index.html" aria-label="返回主页"></a>
                <img src="images/MusicLabBlackLogo.png" width="250" alt="MusicLab">
            </div>
            <ul class="nav">
                <li id="nav1"><a href="index.html"> 主页 </a></li>
                <li id="nav2"><a href="introduction/intro.html"> 开发组介绍 </a></li>
                <li id="nav3"><a href="The Playground/index.html"> 游乐园 </a></li>
                <li id="nav6"><a href="Start Learning/index.html"> 初学者教程 </a></li>
                <li id="nav5"><a href="settings/settings.html"> 设置 </a></li>
                <li id="nav4"><a href="login/login.html"> 登录  |  注册 </a></li>
            </ul>
            <div>
                <hr>
            </div>
        </div><!--home nav-->
        <!--主体-->
        <div class="box">
        <div class="hero-panel">
            <!-- 主视觉图片：放入 images/ 后把下面的注释改回 <img class="hero-bg" src="images/hero.jpg" alt="..."> -->
            <div class="hero-overlay">
                <h1><big>MusicLab ，一个为你量身定做的音乐学习与创作网站</big></h1>
            </div>
        </div>
        <!--登录后的欢迎面板（未登录时隐藏，由 js/musiclab-ui.js 渲染）-->
        <section class="welcome-panel" id="welcomePanel" data-welcome hidden aria-label="欢迎"></section>
        <!--功能模块-->
        <div class="fun_box">
            <div class="functions" id="icon1">
                <div><img src="icons/zero.png" width="120"></div>
                <h2>0基础学习</h2>
                <p>循序渐进</p>
            </div>
            <div class="functions" id="icon2">
                <div><img src="icons/ruler.png" width="120"></div>
                <h2>量身定做</h2>
                <p>任何人都能学</p>
            </div>
            <div class="functions" id="icon3">
                <div><img src="icons/blocks.png" width="120"></div>
                <div>
                    <h2>寓学于乐</h2>
                    <p>边学边尝试</p>
                </div>
            </div>
            <div class="functions" id="icon4">
                <div><img src="icons/track.png" width="120"></div>
                <h2>DAW创作</h2>
                <p>DIY解放天性</p>
            </div>
        </div>
        <!--学习进度（由 js/musiclab-ui.js 渲染）-->
        <section class="content-card progress-panel" id="learningProgress" data-progress-card aria-label="学习进度"></section>
        <!--介绍-->
        <div class="content-card intro-panel">
            <h1>MusicLab可以做什么？</h1>
            <br>
            <h2>MusicLab的功能包括：乐理教程、实操上手、个人DIY式DAW创作，让使用者享受丰富的互动体验，并获得音乐创作的乐趣。</h2>
        </div>
        <div class="entrance content-card qa-panel">
            <h1>Q & A</h1>
            <h2>完成一份问卷，让我们提供更适合你的服务</h2>
            <br>
            <button type="button" class="open-QA" id="OpenQA">
                开始！
            </button>
        </div>
        </div><!--/.box-->
        <script src="js/login.js"></script>
        <script src="js/QA.js"></script>
    </body>
</html>
