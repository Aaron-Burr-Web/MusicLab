                    <input type="checkbox" name="agreement" id="agreementRadio">
                    <label for="agreementRadio">我同意《用户服务条款》</label>
                </div>
                <br><br>
                <div class="form-actions">
                    <button type="submit" class="ml-btn" id="loginSubmitButton" disabled>登录</button>
                    <button type="button" class="ml-btn secondary" id="loginCancelButton">取消</button>
                </div>

        <script src="../js/login.js"></script>
        <script>
            (() => {
                const ML = window.MusicLab;
                const loginForm = document.getElementById('loginForm');
                const usernameInput = document.getElementById('usernameInput');
                const passwordInput = document.getElementById('passwordInput');
                const usernameError = document.getElementById('usernameError');
                const passwordError = document.getElementById('passwordError');
                const agreementRadio = document.getElementById('agreementRadio');
                const agreementRow = document.getElementById('agreementRow');
                const loginSubmitButton = document.getElementById('loginSubmitButton');
                const loginCancelButton = document.getElementById('loginCancelButton');
                const loginBackButton = document.getElementById('loginBackButton');

                // "Back" returns to the previous page on this site, otherwise the homepage.
                const goBack = () => {
                    const cameFromSite = document.referrer
                        && new URL(document.referrer).origin === window.location.origin
                        && !/\/login\//i.test(document.referrer);
                    if (cameFromSite && window.history.length > 1) window.history.back();
                    else window.location.href = '../index.html';
                };
                loginCancelButton.addEventListener('click', goBack);
                loginBackButton.addEventListener('click', (event) => { event.preventDefault(); goBack(); });

                // Already signed in: let the user know instead of showing an empty form.
                if (ML && ML.auth.isLoggedIn()) {
                    ML.toast(`你已经以「${ML.auth.currentUser()}」登录，可在设置中退出`, { type: 'info' });
                }

                const clearFieldError = (fieldError, input) => {
                    fieldError.textContent = '';
                    input.removeAttribute('aria-invalid');
                };

                const showFieldError = (fieldError, input, message) => {
                    fieldError.textContent = message;
                    input.setAttribute('aria-invalid', 'true');
                };

                const validateLoginFields = () => {
                    let hasError = false;
                    clearFieldError(usernameError, usernameInput);
                    clearFieldError(passwordError, passwordInput);

                    if (!usernameInput.value.trim()) {
                        showFieldError(usernameError, usernameInput, '用户名未填写');
                        hasError = true;
                    }
                    if (!passwordInput.value) {
                        showFieldError(passwordError, passwordInput, '密码未填写');
                        hasError = true;
                    }
                    return !hasError;
                };

                const updateAgreementState = () => {
                    const isAgreed = agreementRadio.checked;
                    loginSubmitButton.disabled = !isAgreed;
                    if (isAgreed) agreementRow.classList.remove('warning');
                };

                usernameInput.addEventListener('input', () => {
                    if (usernameInput.value.trim()) clearFieldError(usernameError, usernameInput);
                });
                passwordInput.addEventListener('input', () => {
                    if (passwordInput.value) clearFieldError(passwordError, passwordInput);
                });
                agreementRadio.addEventListener('change', updateAgreementState);

                loginForm.addEventListener('submit', async (event) => {
                    event.preventDefault();

                    if (!agreementRadio.checked) {
                        agreementRow.classList.add('warning');
                        ML && ML.toast('请先同意《用户服务条款》', { type: 'warning' });
                        return;
                    }
                    if (!validateLoginFields()) return;

                    loginSubmitButton.disabled = true;
                    loginSubmitButton.textContent = '登录中…';

                    const result = await ML.auth.login(usernameInput.value, passwordInput.value);

                    if (!result.ok) {
                        loginSubmitButton.disabled = false;
                        loginSubmitButton.textContent = '登录';
                        if (result.field === 'username') showFieldError(usernameError, usernameInput, result.message);
                        else showFieldError(passwordError, passwordInput, result.message);
                        ML.toast(result.message, { type: 'error' });
                        return;
                    }

                    ML.toastAfterReload(`登录成功，欢迎回来，${result.name}！`, 'success');
                    window.location.href = '../index.html';
                });

                updateAgreementState();
            })();
        </script>
    </body>
</html>
